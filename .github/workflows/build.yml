name: Build KroyaBackup

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Projekt auschecken
        uses: actions/checkout@v4

      - name: JDK 21 einrichten
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Mit Maven bauen
        run: mvn -B clean package

      - name: Fertige jar als Download bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: KroyaBackup
          path: target/*.jar
